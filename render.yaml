services:
  - type: web
    name: quick-grid-telemetry-api
    runtime: node
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm run server:start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quick-grid-telemetry-db
          property: connectionString
      - key: INGEST_TOKEN_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
databases:
  - name: quick-grid-telemetry-db
    databaseName: quick_grid_telemetry
    user: quick_grid
